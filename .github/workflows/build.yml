name: Build T1000-E firmware

# The firmware toolchain is not available in every environment, so the
# authoritative build happens here. Artifacts (.uf2 and .zip) are attached to
# each run.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      firmware_version:
        description: 'Version string baked into the firmware'
        required: false
        default: 't1000e-mt'

jobs:
  tests:
    name: Battery curve tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: make -C test

  firmware:
    name: Build t1000e_companion_radio_ble_ps
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('meshcore.lock') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Apply patches and build
        env:
          FIRMWARE_VERSION: ${{ github.event.inputs.firmware_version || 't1000e-mt' }}
        run: ./build.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: t1000e-companion-ble-powersaving
          path: |
            meshcore/out/*.uf2
            meshcore/out/*.zip
          if-no-files-found: error
