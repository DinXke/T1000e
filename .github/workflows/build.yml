name: Build T1000-E firmware

# The firmware toolchain is not available in every environment, so the
# authoritative build happens here. Artifacts (.uf2 and .zip) are attached to
# each run, and pushing a v* tag publishes them as a Release.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      firmware_version:
        description: 'Version string baked into the firmware'
        required: false
        default: 't1000e-mt'
      release_tag:
        description: 'Publish a Release under this tag (leave empty to only build). The tag is created by this workflow.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  tests:
    name: Battery curve tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: make -C test

  firmware:
    name: Build t1000e_companion_radio_ble_ps
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('meshcore.lock') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Pick the version string
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "version=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.firmware_version }}" ]; then
            echo "version=${{ github.event.inputs.firmware_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=t1000e-mt" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply patches and build
        env:
          FIRMWARE_VERSION: ${{ steps.ver.outputs.version }}
        run: ./build.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: t1000e-companion-ble-powersaving
          path: |
            meshcore/out/*.uf2
            meshcore/out/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: firmware
    # Either a pushed v* tag, or a manual run that named a release tag. The
    # second path exists because not every contributor can push tags; gh
    # creates the tag from the built commit.
    if: github.ref_type == 'tag' || github.event.inputs.release_tag != ''
    steps:
      - uses: actions/checkout@v4

      - name: Download built firmware
        uses: actions/download-artifact@v4
        with:
          name: t1000e-companion-ble-powersaving
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.release_tag }}"
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "T1000-E companion (BLE) $TAG" \
            --notes-file RELEASE_NOTES.md \
            dist/*
